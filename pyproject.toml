[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "giesekus-solver"
version = "0.1.0"
description = "Isothermal Giesekus-based viscoelastic Reynolds equation solver for slipper bearings"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Nigel C. Dhlamini", email = "dhlnig001@myuct.ac.za"}
]
keywords = [
    "viscoelastic",
    "lubrication",
    "Giesekus",
    "Reynolds equation",
    "slipper bearing",
    "tribology"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "isort>=5.10",
    "mypy>=0.950",
]
notebooks = [
    "jupyter>=1.0",
    "ipywidgets>=7.6",
]

[project.urls]
Homepage = "https://github.com/nigeldhlamini/giesekus-solver"
Documentation = "https://github.com/nigeldhlamini/giesekus-solver#readme"
Repository = "https://github.com/nigeldhlamini/giesekus-solver.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
